  - id: apo-55727-handplaced-no-plate-hd130322-f162
    observatory: apo
    mjd: 55727
    exposures: "28"
    action: not_science
    reason: >-
      Hand-placed-star test (RV standard HD 130322 on fiber 162). The raw header has 62 of the
      usual 114 cards: every telescope and plate card is missing (PLATEID, CARTID, MAPID, NAME,
      RA/DEC, ALT/AZ, lamps, offsets); the log says the guide-camera actor died at this
      exposure. Without a plate ID almanac has no fiber table for it (and flags it bad anyway).
      Data check (raw up-the-ramp signal, chip b): fiber 162 is the brightest trace (S/N 638 in
      MAD units, next fiber 0.005 of it), so the star was on the logged fiber. The neighbouring
      exposures 27 and 29 (same cart 3) are plate 4823.
    source:
      file: raw/APOGEE/apo/55727/55727.comments
      quote: "28 RV std HD130322, fiber 162. Flux peak ~ 3000 / +28 gcamera actor died, we took time to make guider alive again"
    notes: "not_science for 0.4.1, to revisit. Candidate for a later rescue: plate 4823 (from exposures 27, 29) plus retarget_fibers {162: HD 130322}, other_fibers offtarget."
