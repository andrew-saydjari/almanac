# Exposure overrides applied by almanac (see almanac/overrides.py).
# Add an entry ONLY when the evidence is certain; quote the source verbatim.
# Disable all of them with `almanac --no-overrides`.
#
# ===========================================================================
# NOTE: "robots not moved" entries are marked bad (not_science) for 0.4.1.
# ===========================================================================
# The block between the BEGIN/END robots-not-moved markers below is generated
# by scripts/robots_not_moved/robots_not_moved.py (see the README there for
# the rule). Each entry is an FPS exposure whose header records a newly
# loaded configuration B (recorded_config) while the fiber positioners had
# not moved and were still at the previous configuration A (actual_config),
# so the light in the fibers does not belong to the recorded targets.
#
# For 0.4.1 all of them are marked bad with `not_science`, as the
# conservative choice. The light is real starlight from configuration A,
# and the 2026-11-19 fiber-level data check recovered the true (A) target
# for most affected fibers. After 0.4.1 we want to come back and try to save
# some of them by switching entries to `use_config <A>` (config_id =
# actual_config) for the WHOLE exposure, not individual fibers: fibers that
# B treats as sky carried A's stars, so B's sky fibers are wrong too.
# Only exposures whose data check says MATCHES_A are candidates for that.
# ===========================================================================
