[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdss-almanac"
version = "0.5.3"
authors = [
    { name = "Andy Casey", email = "andrew.casey@monash.edu" }
]
description = "Everything we've got"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD 3-Clause License" }
keywords = ["astronomy", "software"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
# Version ranges: lower bound = the version tested (uv.lock, 2026-11-24) unless an older
# minimum was set deliberately; upper bound = below the next major (next minor for 0.x).
dependencies = [
    "numpy>=2.4.6,<3",
    "astropy>=8.0.3,<9",
    "h5py>=3.16.0,<4",
    "tqdm>=4.70.1,<5",
    "click>=8.5.1,<9",
    "pydl>=1.0.1,<2",
    "sdssdb>=1.1.3,<2",
    "colorlog>=6.12.0,<7",
    "rich>=15.0.0,<16",
    "pydantic>=2.14.4,<3",
    "sdss-semaphore>=0.2.8,<0.3",
    # `almanac add metadata --extended` (HEALPix index); from upstream a922dee.
    "healpy>=1.20.0,<2",
    # Imported directly by almanac; previously present only as transitive
    # dependencies (of astropy, sdssdb, pydantic, pydl). Declared so that the
    # test in tests/test_declared_dependencies.py can hold.
    "peewee>=4.5.3,<5",
    "pydantic-core>=2.50.5,<3",
    "pyerfa>=2.0.1.5,<3",
    "pyyaml>=6.0.4,<7",
    "scipy>=1.17.1,<2",
    "typing-extensions>=4.16.0,<5",
]

[project.urls]
Homepage = "https://github.com/sdss/almanac"
Documentation = "https://sdss-almanac.readthedocs.org"
Repository = "https://github.com/sdss/almanac"

[project.optional-dependencies]
dev = [
    "ipython>=9.19.1,<10",
    "matplotlib>=3.11.2,<4",
    "flake8>=7.5.0,<8",
    "doc8>=2.0.0,<3",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.5.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.17.0,<4",
    "pytest-sugar>=1.1.1,<2",
    "isort>=9.0.2,<10",
    "codecov>=2.1.13,<3",
    "coverage[toml]>=7.17.5,<8",
    "ipdb>=0.13.13,<0.14",
    "invoke>=3.0.3,<4",
    "twine>=7.0.0,<8",
    "wheel>=0.48.0,<0.49",
    "sphinx>=9.0.4,<10"
]
docs = [
    "Sphinx>=9.0.4,<10",
    "furo>=2025.12.19",  # calendar versioning (YYYY.MM.DD): no semver major to cap below
    "sphinx-autodoc-typehints>=3.6.1,<4",
    "myst-parser>=5.2.0,<6",
    "sphinxcontrib-bibtex>=2.7.0,<3",
    "sphinx-copybutton>=0.5.2,<0.6",
    "linkify-it-py>=2.2.0,<3"
]

[project.scripts]
almanac = "almanac.cli:main"

[tool.uv]
package = true

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["almanac*"]

[tool.setuptools.package-data]
almanac = ["etc/*"]

[tool.isort]
line_length = 79
known_first_party = ["almanac"]
known_sdss_party = ["sdssdb", "sdsstools"]
balanced_wrapping = true
include_trailing_comma = false
lines_after_imports = 2
use_parentheses = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "SDSS", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"

[tool.flake8]
ignore = ["H101", "E722", "W504", "W505"]
per-file-ignores = ["*/__init__.py:E,W"]
max-line-length = 99

[tool.pytest.ini_options]
addopts = "--cov almanac --cov-report html -W ignore"

[tool.coverage.run]
branch = true
include = ["src/almanac/*"]
omit = ["*/utils/*.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = []
